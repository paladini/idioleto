[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "idioleto"
version = "0.1.0"
description = "Local-first CLI for compiling and using portable idiolect profiles."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Fernando Paladini" }]
keywords = ["llm", "local-first", "stylometry", "cli", "ollama"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pypdf>=4.2",
  "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/paladini/idioleto"
Repository = "https://github.com/paladini/idioleto"
Issues = "https://github.com/paladini/idioleto/issues"
Changelog = "https://github.com/paladini/idioleto/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]

[project.scripts]
idioleto = "idioleto.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/idioleto"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
